      - path: Resources/Privacy/ModernPong/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      properties:
        CFBundleDisplayName: Minik Ping Pong
        ModernPongTestAdsEnabled: $(MODERN_PONG_TEST_ADS)
        CFBundleLocalizations: [en, am, ar, de, es, fr, he, nl, pt-BR, pt-PT, ru]
    settings:
