        MINIK_ADS_ENABLED: YES
        MINIK_ADS_POLICY_APPROVED: YES
        MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-6728099379581161~9515819906"
        MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: "ca-app-pub-6728099379581161/9759362488"
      configs:
        Debug:
          MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-3940256099942544~1458002511"
          MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: ""
    dependencies:
      - package: AppStoreCommerceKit
        product: AppStoreCommerceKit
      - package: GoogleMobileAds
        product: GoogleMobileAds

  MinikMultiPingPong:
    templates: [MinikApplication]
    # Multi Ping Pong (3/4 players, Android MinikCrossPong) runs its own copy of
    # Modern Ping Pong in MultiPong/; Sources/ModernPong stays the two-player game.
    sources:REPLACE:
      - path: Sources
        excludes:
          - "ModernPong/**"
      - path: MultiPong
      - path: Resources/MinikVisuals.xcassets
        buildPhase: resources
      - path: Resources/MultiPongIcon.xcassets
        buildPhase: resources
      # Multi Ping Pong only: Android 828c6fc legs, the body atlases that fade into them, and the purple home icon.
      - path: Resources/MultiPongAssets.xcassets
        buildPhase: resources
      - path: Resources/ModernPongAssets.xcassets
        buildPhase: resources
      - path: Resources/ModernPongAudio
        buildPhase: resources
      - path: Resources/Localization/All/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Privacy/ModernPong/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      properties:
        CFBundleDisplayName: Multi Ping Pong
        ModernPongTestAdsEnabled: $(MODERN_PONG_TEST_ADS)
        CFBundleLocalizations: [en, he, ar, es, hi, nl]
    settings:
      base:
        # Ads and purchases stay off, as in the Android app, until this app has
        # its own AdMob IDs and App Store products.
        MINIK_APP_ICON_NAME: MultiPingPongAppIcon
        MODERN_PONG_TEST_ADS: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.crosspong
        MINIK_REMOVE_ADS_PRODUCT_IDENTIFIER: remove_ads_multipingpong
        PRODUCT_NAME: MinikMultiPingPong
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MINIK_PING_PONG MINIK_MULTI_PING_PONG"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: FirebaseApple
        product: FirebaseCore
      - package: FirebaseApple
        product: FirebaseAuth
      - package: FirebaseApple
        product: FirebaseDatabase
      - package: AppStoreCommerceKit
        product: AppStoreCommerceKit
      - package: GoogleMobileAds
        product: GoogleMobileAds

  MultiPongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MultiPongTests
    dependencies:
      - target: MinikMultiPingPong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.crosspong.tests
        GENERATE_INFOPLIST_FILE: YES

  MinikAmudu:
    # Standalone port of the Android Spud game (C:/Projects/MinikAmudu); it shares no
    # code with the Minik apps. Ads and purchases stay off until this app has its
    # own AdMob IDs and App Store products.
    type: application
    platform: iOS
    sources:
      - path: Amudu
      - path: Resources/Privacy/Amudu/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: GeneratedInfoPlists/MinikAmudu-Info.plist
      properties:
        CFBundleDisplayName: Spud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, he, ar, es, hi, nl]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Portrait only, as on Android; iPad allows that only as a full-screen app.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.spud
        PRODUCT_NAME: MinikAmudu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MINIK_MARKETING_VERSION: "1.0"
        MINIK_BUILD_NUMBER: "1"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: FirebaseApple
        product: FirebaseCore
      - package: FirebaseApple
        product: FirebaseAuth
      - package: FirebaseApple
        product: FirebaseDatabase

  AmuduTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AmuduTests
    dependencies:
      - target: MinikAmudu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.spud.tests
        GENERATE_INFOPLIST_FILE: YES

  MinikSplash:
    # Standalone port of the Android Minik Splash game (C:/Projects/MinikSplash); it shares no
    # code with the Minik apps. Ads and purchases stay off until this app has its
    # own AdMob IDs and App Store products.
    type: application
    platform: iOS
    sources:
      - path: Splash
      - path: Resources/Privacy/Splash/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: GeneratedInfoPlists/MinikSplash-Info.plist
      properties:
        CFBundleDisplayName: Minik Splash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, he, ar, es, hi, nl]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Portrait only, as on Android; iPad allows that only as a full-screen app.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.splash
        PRODUCT_NAME: MinikSplash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MINIK_MARKETING_VERSION: "1.0"
        MINIK_BUILD_NUMBER: "1"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: FirebaseApple
        product: FirebaseCore
      - package: FirebaseApple
        product: FirebaseAuth
      - package: FirebaseApple
        product: FirebaseDatabase

  SplashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SplashTests
    dependencies:
      - target: MinikSplash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.minik.splash.tests
        GENERATE_INFOPLIST_FILE: YES

  ProductConfigurationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ProductConfigurationTests
    dependencies:
      - target: MinikPlus
      - package: AppStoreCommerceKit
        product: AppStoreCommerceKit
    settings:
      base:
        MINIK_TESTS_BUNDLE_IDENTIFIER: com.appsbybros.minik.tests
        PRODUCT_BUNDLE_IDENTIFIER: $(MINIK_TESTS_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MinikPlus:
    build:
      targets:
        MinikPlus: all
        ProductConfigurationTests: [test]
    test:
      targets:
        - ProductConfigurationTests
  MinikPlusEnglish:
    build:
      targets:
        MinikPlusEnglish: all
  MinikMath:
    build:
      targets:
        MinikMath: all
        MinikMathTests: [test]
    test:
      targets:
        - MinikMathTests
  MinikMathPlus:
    build:
      targets:
        MinikMathPlus: all
  MinikPingPong:
    build:
      targets:
        MinikPingPong: all

  MinikRetroPingPong:
    build:
      targets:
        MinikRetroPingPong: all
    run:
      config: Debug

  MinikMultiPingPong:
    build:
      targets:
        MinikMultiPingPong: all
        MultiPongTests: [test]
    test:
