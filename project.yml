name: Minik
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MINIK_MARKETING_VERSION: "1.7.9"
    MINIK_BUILD_NUMBER: "79"
    MARKETING_VERSION: $(MINIK_MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(MINIK_BUILD_NUMBER)
    VERSIONING_SYSTEM: apple-generic

packages:
  AppStoreCommerceKit:
    path: Packages/AppStoreCommerceKit
  FirebaseApple:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.14.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.9.0

targetTemplates:
  MinikApplication:
    type: application
    platform: iOS
    settings:
      base:
        MINIK_APP_ICON_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: $(MINIK_APP_ICON_NAME)
        MINIK_REMOVE_ADS_PRODUCT_IDENTIFIER: remove_ads
        MINIK_ADS_ENABLED: NO
        MINIK_ADS_POLICY_APPROVED: NO
        # Google's published iOS sample app ID keeps the linked Google Mobile Ads SDK
        # from rejecting launch while ads are off. MinikAdsConfiguration treats it as
        # unconfigured, so no ad is requested until a target supplies real IDs.
        MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-3940256099942544~1458002511"
        MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: ""
        MINIK_PRIVACY_POLICY_URL: https://miniklearn.com/privacy
        MINIK_TERMS_OF_USE_URL: https://www.easycallandanswer.com/terms.html
        MINIK_SUPPORT_URL: https://miniklearn.com/contact
        MINIK_LEGAL_NOTICE: "© Apps by Bros. All rights reserved."
    sources:
      - path: Sources
      - path: Resources/MinikVisuals.xcassets
        buildPhase: resources
    info:
      path: GeneratedInfoPlists/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: ${target_name}
        # XcodeGen otherwise writes 1.0 (1), ignoring the version build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MinikRemoveAdsProductIdentifier: $(MINIK_REMOVE_ADS_PRODUCT_IDENTIFIER)
        MinikAdsEnabled: $(MINIK_ADS_ENABLED)
        MinikAdsPolicyApproved: $(MINIK_ADS_POLICY_APPROVED)
        MinikAdsApplicationIdentifier: $(MINIK_ADS_APPLICATION_IDENTIFIER)
        GADApplicationIdentifier: $(MINIK_ADS_APPLICATION_IDENTIFIER)
        MinikInterstitialAdUnitIdentifier: $(MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER)
        MinikPrivacyPolicyURL: $(MINIK_PRIVACY_POLICY_URL)
        MinikTermsOfUseURL: $(MINIK_TERMS_OF_USE_URL)
        MinikSupportURL: $(MINIK_SUPPORT_URL)
        MinikLegalNotice: $(MINIK_LEGAL_NOTICE)
        # The apps use only the operating system's standard HTTPS encryption.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

targets:
  MinikPlus:
    templates: [MinikApplication]
    sources:
      - path: Resources/GameAudio
        buildPhase: resources
      - path: Resources/LanguageImages.xcassets
        buildPhase: resources
      - path: Resources/LanguageMedia
        buildPhase: resources
      - path: Resources/LanguageLetters.xcassets
        buildPhase: resources
      - path: Resources/LanguageActivityArt.xcassets
        buildPhase: resources
      - path: Resources/Vocabulary/words-normalized.xml
        buildPhase: resources
      - path: Resources/Vocabulary/vocabulary-image-manifest.tsv
        buildPhase: resources
      - path: Resources/ThirdPartyNotices/VocabularyAssetNotices.txt
        buildPhase: resources
      - path: Resources/Localization/All/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Privacy/Language/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Fredoka Bold for the rainbow-sky design (MinikPrettyDesign.swift).
      - path: Resources/Fonts
        buildPhase: resources
    info:
      properties:
        CFBundleDisplayName: Minik
        UIAppFonts: [fredoka_medium.ttf, fredoka_bold.ttf]
        CFBundleLocalizations: [en, am, ar, de, es, fr, he, nl, pt-BR, pt-PT, ru]
        # Portrait only, as on Android (sensorPortrait); iPad allows that only as a
        # full-screen app. :REPLACE stops XcodeGen appending the template's landscape
        # entries to these arrays. iPadOS 26 no longer turns the screen for a
        # portrait-only app and draws it between black bars on an iPad held in
        # landscape, so Sources/PortraitNotice.swift asks to turn the iPad (ISSUE-004).
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:REPLACE:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:REPLACE:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        MINIK_APP_ICON_NAME: MinikPlusAppIcon
        MINIK_PLUS_BUNDLE_IDENTIFIER: com.appsbybros.minik.plus
        PRODUCT_BUNDLE_IDENTIFIER: $(MINIK_PLUS_BUNDLE_IDENTIFIER)
        # App Store product IDs are unique per developer account.
        MINIK_REMOVE_ADS_PRODUCT_IDENTIFIER: remove_ads_minik
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/MinikLanguage.entitlements
        MINIK_FIREBASE_PLIST_PATH: "$(SRCROOT)/Config/Firebase/MinikPlus/GoogleService-Info.plist"
        PRODUCT_NAME: MinikPlus
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MINIK_PLUS"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # Release shows child-directed, non-personalized interstitials; Debug keeps
        # Google's sample app ID, which MinikAdsConfiguration treats as ads off.
        MINIK_ADS_ENABLED: YES
        MINIK_ADS_POLICY_APPROVED: YES
        MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-6728099379581161~3837875403"
        MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: "ca-app-pub-6728099379581161/7520211955"
      configs:
        Debug:
          MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-3940256099942544~1458002511"
          MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: ""
    preBuildScripts:
      - name: Copy configured Firebase plist
        script: |
          if [ -z "$MINIK_FIREBASE_PLIST_PATH" ]; then
            exit 0
          fi
          if [ ! -f "$MINIK_FIREBASE_PLIST_PATH" ]; then
            echo "error: MINIK_FIREBASE_PLIST_PATH does not exist: $MINIK_FIREBASE_PLIST_PATH"
            exit 1
          fi
          /usr/bin/plutil -lint "$MINIK_FIREBASE_PLIST_PATH"
          if ! firebase_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$MINIK_FIREBASE_PLIST_PATH" 2>/dev/null)"; then
            echo "error: Firebase plist is missing BUNDLE_ID: $MINIK_FIREBASE_PLIST_PATH"
            exit 1
          fi
          if [ "$firebase_bundle_id" != "$PRODUCT_BUNDLE_IDENTIFIER" ]; then
            echo "error: Firebase BUNDLE_ID '$firebase_bundle_id' does not match target '$PRODUCT_BUNDLE_IDENTIFIER'"
            exit 1
          fi
          firebase_destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          /bin/mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          /bin/cp "$MINIK_FIREBASE_PLIST_PATH" "$firebase_destination"
    dependencies:
      - package: AppStoreCommerceKit
        product: AppStoreCommerceKit
      - package: FirebaseApple
        product: FirebaseAuth
      - package: FirebaseApple
        product: FirebaseCore
      - package: FirebaseApple
        product: FirebaseFirestore
      - package: FirebaseApple
        product: FirebaseAppCheck
      - package: GoogleMobileAds
        product: GoogleMobileAds

