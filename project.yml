        MINIK_ADS_ENABLED: YES
        MINIK_ADS_POLICY_APPROVED: YES
        MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-6728099379581161~2128284471"
        MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: "ca-app-pub-6728099379581161/5768146581"
        MINIK_APP_ICON_NAME: ModernPongAppIcon
        MODERN_PONG_TEST_ADS: NO
        MINIK_PING_PONG_BUNDLE_IDENTIFIER: com.appsbybros.minik.pingpong
        PRODUCT_BUNDLE_IDENTIFIER: $(MINIK_PING_PONG_BUNDLE_IDENTIFIER)
        # App Store product IDs are unique per developer account.
        MINIK_REMOVE_ADS_PRODUCT_IDENTIFIER: remove_ads_pingpong
        PRODUCT_NAME: MinikPingPong
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MINIK_PING_PONG"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Debug:
          MODERN_PONG_TEST_ADS: YES
          MINIK_ADS_APPLICATION_IDENTIFIER: "ca-app-pub-3940256099942544~1458002511"
          MINIK_INTERSTITIAL_AD_UNIT_IDENTIFIER: ""
    dependencies:
      - package: FirebaseApple
        product: FirebaseCore
      - package: FirebaseApple
        product: FirebaseAuth
      - package: FirebaseApple
        product: FirebaseDatabase
      - package: AppStoreCommerceKit
        product: AppStoreCommerceKit
      - package: GoogleMobileAds
        product: GoogleMobileAds

