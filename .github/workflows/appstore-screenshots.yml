name: App Store screenshots

# Captures every scene in appstore/screenshots.json on a 6.9-inch iPhone and a
# 13-inch iPad Simulator, frames them with captions at Apple's exact sizes and
# checks them against App Store Connect's rules. Only started by hand.
on:
  workflow_dispatch:
    inputs:
      products:
        description: Apps to capture, separated by spaces ("all" = the list below; MinikPingPong only when named)
        required: true
        default: MinikPlus MinikPlusEnglish MinikMathPlus MinikMath MinikRetroPingPong MinikMultiPingPong MinikAmudu MinikSplash MinikSquash MinikBeachVolley MinikTripleShot
      languages:
        description: Languages to capture, separated by spaces (e.g. "en he"), or "all" for every language each app ships
        required: true
        default: all

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      products: ${{ steps.plan.outputs.products }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Split the apps into capture jobs
        id: plan
        shell: bash
        env:
          PRODUCTS: ${{ inputs.products }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          # One macOS job per product group keeps each job well inside its time limit.
          # Apps whose scene hooks are still pending are skipped with a warning.
          matrix="$(python3 Scripts/appstore-screenshots.py plan --products $PRODUCTS --languages $LANGUAGES)"
          products="$(python3 -c 'import json,sys; print(" ".join(e["products"] for e in json.loads(sys.argv[1])["include"]))' "$matrix")"
          echo "Capture jobs: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "products=$products" >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    name: capture (${{ matrix.group }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build apps for the Simulator
        shell: bash
        env:
          PRODUCTS: ${{ matrix.products }}
        run: |
          set -uo pipefail
          mkdir -p build/logs
          failed=""
          for SCHEME in $PRODUCTS; do
            echo "Building $SCHEME"
            if ! xcodebuild build \
              -project Minik.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath build/DerivedData/Shared \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=NO \
              > "build/logs/$SCHEME-build.log" 2>&1; then
              echo "::error::Build failed for $SCHEME"
              grep -E "error:" "build/logs/$SCHEME-build.log" | sort -u | head -30 || true
              failed="$failed $SCHEME"
            fi
          done
          echo "FAILED_BUILDS=$failed" >> "$GITHUB_ENV"

      - name: Start the iPhone and iPad Simulators
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/available-devices.json
          python3 - <<'PY' > build/simulators.tsv
          import json
          import re

          data = json.load(open("build/available-devices.json", encoding="utf-8"))
          phones, tablets = [], []
          for runtime, devices in data.get("devices", {}).items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(value) for value in re.findall(r"\d+", runtime))
              for device in devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable"):
                      continue
                  if name.startswith("iPhone") and "Pro Max" in name:
                      model = re.search(r"iPhone\s+(\d+)", name)
                      phones.append((version, int(model.group(1)) if model else 0, name, device["udid"]))
                  elif name.startswith("iPad Pro") and "13" in name:
                      tablets.append((version, name, device["udid"]))
          if not phones or not tablets:
              raise SystemExit("No 6.9-inch iPhone Pro Max or 13-inch iPad Pro Simulator is available")
          phone, tablet = max(phones), max(tablets)
          print(f"iphone\t{phone[3]}\t{phone[2]}")
          print(f"ipad\t{tablet[2]}\t{tablet[1]}")
          PY
          while IFS=$'\t' read -r DEVICE UDID NAME; do
            echo "$DEVICE: $NAME"
            xcrun simctl boot "$UDID" < /dev/null || true
            xcrun simctl bootstatus "$UDID" -b < /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100 < /dev/null
          done < build/simulators.tsv

      - name: Capture scenes
        shell: bash
        env:
          PRODUCTS: ${{ matrix.products }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          # GitHub runs this with -e; one failing simctl call must not end the whole job.
          set +e -uo pipefail
          # A struggling Simulator can hang simctl (a launch once waited 19 minutes and then
          # found the iPad shut down), so no call may wait long.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          running() {
            xcrun simctl list devices < /dev/null | grep -F "$1" | grep -q "(Booted)" && return 0
            echo "::warning::Simulator $1 had shut down; starting it again"
            xcrun simctl boot "$1" < /dev/null > /dev/null 2>&1
            limit 900 xcrun simctl bootstatus "$1" -b < /dev/null > /dev/null 2>&1
            xcrun simctl status_bar "$1" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100 < /dev/null > /dev/null 2>&1
          }
          shot() {
            rm -f "$OUT"
            limit 60 xcrun simctl terminate "$UDID" "$BUNDLE" < /dev/null > /dev/null 2>&1
            # -MinikOfflineSmoke keeps Modern Ping Pong away from production Firebase.
            limit 180 xcrun simctl launch "$UDID" "$BUNDLE" \
              -MinikScreenshotScene "$SCENE" \
              -MinikScreenshotOrientation "$ORIENTATION" \
              -MinikOfflineSmoke YES \
              -AppleLanguages "($LANGUAGE)" \
              -AppleLocale "$LOCALE" < /dev/null > /dev/null 2>&1 || return 1
            sleep "$WAIT"
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT" < /dev/null > /dev/null 2>&1 && [ -s "$OUT" ]
          }
          missing=0
          for SCHEME in $PRODUCTS; do
            case " $FAILED_BUILDS " in *" $SCHEME "*) continue ;; esac
            APP="build/DerivedData/Shared/Build/Products/Debug-iphonesimulator/$SCHEME.app"
            BUNDLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")"
            python3 Scripts/appstore-screenshots.py scenes "$SCHEME" > "build/$SCHEME-scenes.txt"
            python3 Scripts/appstore-screenshots.py languages "$SCHEME" --only $LANGUAGES > "build/$SCHEME-languages.txt"
            while IFS=$'\t' read -r DEVICE UDID NAME; do
              running "$UDID"
              limit 120 xcrun simctl uninstall "$UDID" "$BUNDLE" < /dev/null > /dev/null 2>&1
              limit 300 xcrun simctl install "$UDID" "$APP" < /dev/null
              while IFS='|' read -r LANGUAGE LOCALE; do
                while IFS='|' read -r ID SCENE WAIT IPHONE_ORIENTATION IPAD_ORIENTATION; do
                  ORIENTATION="$IPHONE_ORIENTATION"
                  [ "$DEVICE" = "ipad" ] && ORIENTATION="$IPAD_ORIENTATION"
                  OUT="build/appstore-raw/$SCHEME/$LANGUAGE/$DEVICE/$ID.png"
                  mkdir -p "$(dirname "$OUT")"
                  # One retry, after restarting the Simulator if it shut down.
                  if shot || { running "$UDID"; shot; }; then
                    echo "Captured $SCHEME $LANGUAGE $DEVICE $ID"
                  else
                    echo "::warning::No capture for $SCHEME $LANGUAGE $DEVICE $ID"
                    missing=$((missing + 1))
                  fi
                done < "build/$SCHEME-scenes.txt"
              done < "build/$SCHEME-languages.txt"
              limit 60 xcrun simctl terminate "$UDID" "$BUNDLE" < /dev/null > /dev/null 2>&1
            done < build/simulators.tsv
          done
          echo "Missing captures: $missing"
          if [ -n "$FAILED_BUILDS" ]; then
            echo "::error::Not captured because the build failed:$FAILED_BUILDS"
            exit 1
          fi
          exit 0

      - name: Upload raw captures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-raw-${{ matrix.group }}
          path: |
            build/appstore-raw
            build/logs
          if-no-files-found: ignore
          retention-days: 7

  compose:
    needs: [plan, capture]
    if: ${{ always() && needs.plan.result == 'success' && needs.capture.result != 'cancelled' }}
    runs-on: ubuntu-latest
    # Framing every language of every app took longer than 45 minutes (2026-10-24).
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download raw captures
        uses: actions/download-artifact@v4
        with:
          pattern: AppStore-raw-*
          path: build/raw-artifact
          merge-multiple: true

      - name: Frame and validate the screenshots
        shell: bash
        env:
          PRODUCTS: ${{ needs.plan.outputs.products }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          # Arabic and Devanagari captions need Noto; Heebo covers Latin and Hebrew.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core > /dev/null
          python3 -m pip install --quiet pillow
          # Fails, listing every problem, if any output breaks App Store Connect's rules
          # (pixel size, PNG/JPEG, RGB without alpha, sRGB, 1-10 per slot, file size).
          python3 Scripts/appstore-screenshots.py compose \
            --raw build/raw-artifact/appstore-raw \
            --out build/AppStore-screenshots \
            --apps $PRODUCTS \
            --languages $LANGUAGES

      - name: Upload App Store screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # Ready for App Store Connect: <App>/<locale>/<iphone-6.9|ipad-13>/NN-id.png, plus index.html.
          name: AppStore-screenshots
          path: build/AppStore-screenshots
          if-no-files-found: error
          retention-days: 14
