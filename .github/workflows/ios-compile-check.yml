name: iOS Compile Check
# The release script (public-export/release_ios.py on the owner's PC) finds its run by the request id.
run-name: ${{ inputs.request && format('iOS Compile Check ({0})', inputs.request) || 'iOS Compile Check' }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Set by the release script to follow this run; leave empty
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install or verify XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Compile every app and the tests, stopping at the first failure
        shell: bash
        run: |
          # GitHub runs "shell: bash" as "bash -e -o pipefail": without "set +e" the first failing
          # build or test run ends this step before the remaining apps are compiled.
          set +e
          set -uo pipefail
          mkdir -p build/logs
          # One shared DerivedData builds Firebase, Google Mobile Ads and the commerce
          # package once for all apps. Compile only for the Apple-silicon simulator.
          DERIVED_DATA="build/DerivedData/Shared"
          COMMON=(-project Minik.xcodeproj -configuration Debug -sdk iphonesimulator
                  -destination "generic/platform=iOS Simulator" -derivedDataPath "$DERIVED_DATA"
                  CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                  ARCHS=arm64 ONLY_ACTIVE_ARCH=NO)
          status=0
          # MinikPlus compiles nearly all shared code. In a private repository (paid macOS
          # minutes) a failing app stops the run; in a public one (free minutes) every app is
          # compiled, so one run lists all errors. A test failure never stops the apps.
          STOP_AT_FIRST_FAILURE="${{ github.event.repository.private }}"
          # Minik Math's and the sports (Android parity) unit tests also run, on the newest available iPhone simulator.
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import re
          import sys

          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"\.iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      key = (version, device["name"], device["udid"])
                      if best is None or key[0] > best[0] or (key[0] == best[0] and key[1:] < best[1:]):
                          best = key
          print(best[2] if best else "")
          ')"
          for SCHEME in MinikPlus MinikPingPong MinikRetroPingPong MinikMathPlus MinikMath MinikPlusEnglish MinikMultiPingPong MinikAmudu MinikSplash MinikSquash MinikBeachVolley; do
            echo "Compiling $SCHEME"
            xcodebuild build -scheme "$SCHEME" "${COMMON[@]}" > "build/logs/$SCHEME.log" 2>&1
            scheme_status=$?
            if (( scheme_status != 0 )); then
              echo "::error::Compile failed for $SCHEME"
              status=$scheme_status
              if [ "$STOP_AT_FIRST_FAILURE" = "true" ]; then
                break
              fi
              continue
            fi
            # Each app with a test target also compiles its tests.
            TESTS=""
            case "$SCHEME" in
              MinikPlus) TESTS=ProductConfigurationTests ;;
              MinikMath) TESTS=MinikMathTests ;;
              MinikMultiPingPong) TESTS=MultiPongTests ;;
              MinikAmudu) TESTS=AmuduTests ;;
              MinikSplash) TESTS=SplashTests ;;
              MinikSquash) TESTS=SportsTests ;;
            esac
            if [ -n "$TESTS" ]; then
              echo "Compiling $TESTS"
              xcodebuild build-for-testing -scheme "$SCHEME" "${COMMON[@]}" > "build/logs/$TESTS.log" 2>&1
              test_status=$?
              if (( test_status != 0 )); then
                echo "::error::Compile failed for $TESTS"
                status=$test_status
              elif [ "$SCHEME" = "MinikMath" ] || [ "$SCHEME" = "MinikSquash" ]; then
                if [ -n "$SIMULATOR_UDID" ]; then
                  echo "Running $TESTS"
                  xcodebuild test-without-building -project Minik.xcodeproj -scheme "$SCHEME" -configuration Debug \
                    -derivedDataPath "$DERIVED_DATA" -destination "id=$SIMULATOR_UDID" > "build/logs/$TESTS-run.log" 2>&1
                  run_status=$?
                  if (( run_status != 0 )); then
                    echo "::error::Unit tests failed for $SCHEME (log: $TESTS-run.log)"
                    status=$run_status
                  fi
                else
                  echo "::warning::No iPhone simulator is available; $TESTS were compiled but not run."
                fi
              fi
            fi
          done

          # Every distinct compiler error with file and line, in the log and the run summary.
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = os.environ.get("GITHUB_WORKSPACE", "") + "/"
          seen = []
          for log in sorted(Path("build/logs").glob("*.log")):
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  if re.search(r"(^|\s|:)(error|fatal error): ", line) or line.startswith("ld: ") or "Undefined symbol" in line:
                      entry = line.replace(root, "").strip()
                      if entry not in seen:
                          seen.append(entry)
          text = "\n".join(seen) if seen else "No compiler errors."
          Path("build/logs/errors.txt").write_text(text + "\n", encoding="utf-8")
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Compiler errors (%d)\n\n```\n%s\n```\n" % (len(seen), text))
          PY
          exit $status

      - name: Upload compile logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Compile-check-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 3
